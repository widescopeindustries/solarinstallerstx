<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found | SolarInstallersTX</title>
    <meta name="description" content="The page you're looking for doesn't exist. Return to our homepage to find solar installers and information." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="author" content="SolarInstallersTX" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        body {
            background: linear-gradient(135deg, #f5f5f5 0%, #ffffff 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .error-container {
            text-align: center;
            max-width: 600px;
            width: 100%;
        }
        
        .error-code {
            font-size: 120px;
            font-weight: 900;
            background: linear-gradient(135deg, #3b82f6 0%, #1e40af 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            line-height: 1;
        }
        
        .error-title {
            font-size: 32px;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 16px;
        }
        
        .error-message {
            font-size: 18px;
            color: #6b7280;
            margin-bottom: 32px;
            line-height: 1.6;
        }
        
        .error-url {
            background-color: #f3f4f6;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 32px;
            word-break: break-all;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 14px;
            color: #374151;
        }
        
        .button-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 48px;
        }
        
        button, a.button {
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }
        
        .button-primary {
            background-color: #3b82f6;
            color: white;
        }
        
        .button-primary:hover {
            background-color: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.3);
        }
        
        .button-secondary {
            background-color: white;
            color: #3b82f6;
            border: 2px solid #3b82f6;
        }
        
        .button-secondary:hover {
            background-color: #eff6ff;
            transform: translateY(-2px);
        }
        
        .helpful-links {
            border-top: 1px solid #e5e7eb;
            padding-top: 32px;
            margin-top: 32px;
        }
        
        .helpful-links-title {
            font-size: 14px;
            font-weight: 600;
            color: #6b7280;
            margin-bottom: 16px;
        }
        
        .helpful-links-list {
            list-style: none;
            display: flex;
            gap: 24px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .helpful-links-list a {
            color: #3b82f6;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.3s ease;
        }
        
        .helpful-links-list a:hover {
            color: #1e40af;
            text-decoration: underline;
        }
        
        @media (max-width: 640px) {
            .error-code {
                font-size: 80px;
            }
            
            .error-title {
                font-size: 24px;
            }
            
            .error-message {
                font-size: 16px;
            }
            
            .button-group {
                flex-direction: column;
            }
            
            button, a.button {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">404</div>
        <h1 class="error-title">Page Not Found</h1>
        <p class="error-message">
            Sorry, the page you're looking for doesn't exist or has been moved.
        </p>
        
        <div class="error-url" id="urlDisplay"></div>
        
        <div class="button-group">
            <button class="button-secondary" onclick="window.history.back()">
                ← Go Back
            </button>
            <a href="/" class="button button-primary">
                → Return Home
            </a>
        </div>
        
        <div class="helpful-links">
            <p class="helpful-links-title">Helpful Links:</p>
            <ul class="helpful-links-list">
                <li><a href="/">Home</a></li>
                <li><a href="/installers">Find Installers</a></li>
                <li><a href="/learn">Learning Center</a></li>
                <li><a href="/contact">Contact Us</a></li>
            </ul>
        </div>
    </div>
    
    <script>
        // Display the requested URL
        document.getElementById('urlDisplay').textContent = 'Requested URL: ' + window.location.pathname;
        
        // Log 404 for monitoring
        console.warn('404 - Page Not Found:', window.location.pathname);
    </script>
</body>
</html>
