<title>☀️ SolarInstallersTX — Elise's Call Tracker</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f13; color: #e2e8f0; min-height: 100vh; }

.top-bar { background: #13131a; border-bottom: 1px solid #1e1e2e; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; position: sticky; top: 0; z-index: 100; }
.top-bar h1 { font-size: 16px; font-weight: 700; background: linear-gradient(135deg, #f59e0b, #fbbf24); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.filters input, .filters select { background: #1e1e2e; border: 1px solid #2d2d3d; border-radius: 8px; color: #e2e8f0; padding: 7px 12px; font-size: 13px; outline: none; }
.filters input { width: 200px; }
.filters input:focus, .filters select:focus { border-color: #fbbf24; }
.export-btn { background: #1e293b; border: 1px solid #334155; color: #94a3b8; font-size: 12px; padding: 7px 14px; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
.export-btn:hover { border-color: #fbbf24; color: #fbbf24; }

.stats-bar { display: flex; gap: 0; background: #13131a; border-bottom: 1px solid #1e1e2e; padding: 0; overflow-x: auto; }
.stat { padding: 10px 20px; font-size: 12px; border-right: 1px solid #1e1e2e; white-space: nowrap; cursor: pointer; transition: background 0.15s; }
.stat:hover { background: #1a1a24; }
.stat .n { font-size: 20px; font-weight: 800; display: block; line-height: 1.2; }
.stat .l { color: #64748b; margin-top: 2px; display: block; }
.stat.total .n { color: #94a3b8; }
.stat.not_called .n { color: #64748b; }
.stat.interested .n { color: #34d399; }
.stat.voicemail .n { color: #a78bfa; }
.stat.no_answer .n { color: #f87171; }
.stat.claimed .n { color: #fbbf24; }
.stat.not_interested .n { color: #475569; }

.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th { background: #13131a; color: #64748b; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; padding: 10px 12px; text-align: left; border-bottom: 2px solid #1e1e2e; white-space: nowrap; cursor: pointer; user-select: none; position: sticky; top: 88px; z-index: 50; }
thead th:hover { color: #fbbf24; }
thead th.sorted-asc::after { content: ' ↑'; color: #fbbf24; }
thead th.sorted-desc::after { content: ' ↓'; color: #fbbf24; }
tbody tr { border-bottom: 1px solid #141420; transition: background 0.1s; }
tbody tr:hover { background: #16161f; }
tbody tr.highlight-interested { background: #052e1a; }
tbody tr.highlight-claimed { background: #2d1a00; }
td { padding: 9px 12px; vertical-align: middle; }
td.num { color: #475569; font-size: 11px; width: 40px; }
td.company { font-weight: 600; color: #e2e8f0; max-width: 180px; }
td.contact { color: #94a3b8; max-width: 140px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
td.city { color: #94a3b8; white-space: nowrap; }
td.phone a { color: #60a5fa; text-decoration: none; font-family: monospace; font-size: 12px; white-space: nowrap; }
td.phone a:hover { color: #93c5fd; text-decoration: underline; }
td.email { max-width: 160px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
td.email a { color: #7dd3fc; text-decoration: none; font-size: 12px; }
td.website a { color: #a78bfa; text-decoration: none; font-size: 11px; }
td.website a:hover { text-decoration: underline; }

.status-select { background: transparent; border: 1px solid #2d2d3d; border-radius: 6px; color: #e2e8f0; padding: 4px 8px; font-size: 12px; cursor: pointer; outline: none; min-width: 130px; }
.status-select:focus { border-color: #fbbf24; }
.status-select.s-not_called { border-color: #2d2d3d; color: #64748b; }
.status-select.s-interested { border-color: #34d399; color: #34d399; background: #052e1a; }
.status-select.s-voicemail { border-color: #a78bfa; color: #a78bfa; background: #1a0a2e; }
.status-select.s-no_answer { border-color: #f87171; color: #f87171; background: #2d0808; }
.status-select.s-claimed { border-color: #fbbf24; color: #fbbf24; background: #2d1a00; }
.status-select.s-not_interested { border-color: #334155; color: #475569; }

.notes-input { background: transparent; border: 1px solid #1e293b; border-radius: 6px; color: #94a3b8; padding: 4px 8px; font-size: 12px; width: 180px; outline: none; font-family: inherit; }
.notes-input:focus { border-color: #334155; color: #e2e8f0; background: #13131a; }

.no-results { text-align: center; padding: 60px; color: #334155; font-size: 16px; }
.row-count { color: #475569; font-size: 12px; padding: 8px 16px; background: #0f0f13; border-top: 1px solid #1e1e2e; }
</style>
</head>

<div class="top-bar">
  <h1>☀️ SolarInstallersTX — Call Tracker</h1>
  <div class="filters">

    <select id="statusFilter" onchange="render()">

      <option value="no_answer">No Answer</option>

      <option value="not_interested">Not Interested</option>
    </select>
    <button class="export-btn" onclick="exportCSV()">⬇ Export CSV</button>
  </div>
</div>

<div class="stats-bar" id="statsBar"></div>

<div class="table-wrap">
<table id="mainTable">

</table>
<div class="row-count" id="rowCount"></div>
</div>

let data = RAW.map((r, i) => ({...r, _idx: i}));
let sortCol = '#';
let sortDir = 1;

// Load saved state
function loadState() {
  try {
    const saved = JSON.parse(localStorage.getItem('solar_tracker_v2') || '{}');
    data.forEach(r => {
      const key = r['#'] + '_' + r.Company.slice(0,10);
      if (saved[key]) {
        r.Status = saved[key].status || r.Status;
        r.Notes = saved[key].notes || r.Notes;
      }
    });
  } catch(e) {}
}

function saveRow(num, company, status, notes) {
  try {
    const saved = JSON.parse(localStorage.getItem('solar_tracker_v2') || '{}');
    const key = num + '_' + company.slice(0,10);
    saved[key] = { status, notes };
    localStorage.setItem('solar_tracker_v2', JSON.stringify(saved));
  } catch(e) {}
}

function updateStats() {
  const counts = { total: data.length, not_called: 0, interested: 0, voicemail: 0, no_answer: 0, claimed: 0, not_interested: 0 };
  data.forEach(r => { if (counts[r.Status] !== undefined) counts[r.Status]++; });
  document.getElementById('statsBar').innerHTML = 
    <div class="stat total" onclick="document.getElementById('statusFilter').value='';render()">
      <span class="n"></span><span class="l">Total</span>
    </div>
    <div class="stat not_called" onclick="document.getElementById('statusFilter').value='not_called';render()">
      <span class="n"></span><span class="l">Not Called</span>
    </div>
    <div class="stat interested" onclick="document.getElementById('statusFilter').value='interested';render()">
      <span class="n"></span><span class="l">Interested 🔥</span>
    </div>
    <div class="stat voicemail" onclick="document.getElementById('statusFilter').value='voicemail';render()">
      <span class="n"></span><span class="l">Voicemail</span>
    </div>
    <div class="stat no_answer" onclick="document.getElementById('statusFilter').value='no_answer';render()">
      <span class="n"></span><span class="l">No Answer</span>
    </div>
    <div class="stat claimed" onclick="document.getElementById('statusFilter').value='claimed';render()">
      <span class="n"></span><span class="l">Claimed ✅</span>
    </div>
    <div class="stat not_interested" onclick="document.getElementById('statusFilter').value='not_interested';render()">
      <span class="n"></span><span class="l">Not Interested</span>
    </div>
  ;
}

function getFiltered() {
  const q = document.getElementById('search').value.toLowerCase();
  const city = document.getElementById('cityFilter').value;
  const status = document.getElementById('statusFilter').value;
  return data.filter(r => {
    if (q && !r.Company.toLowerCase().includes(q) && !r.City.toLowerCase().includes(q) && !r.Contact.toLowerCase().includes(q) && !r.Phone.includes(q)) return false;
    if (city && r.City !== city) return false;
    if (status && r.Status !== status) return false;
    return true;
  }).sort((a, b) => {
    let av = a[sortCol] ?? a['#'];
    let bv = b[sortCol] ?? b['#'];
    if (sortCol === '#') { av = parseInt(av); bv = parseInt(bv); }
    else { av = String(av).toLowerCase(); bv = String(bv).toLowerCase(); }
    return av < bv ? -sortDir : av > bv ? sortDir : 0;
  });
}

function render() {
  const rows = getFiltered();
  const tbody = document.getElementById('tbody');
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="9" class="no-results">No installers match your filters</td></tr>';
    document.getElementById('rowCount').textContent = '0 results';
    return;
  }
  tbody.innerHTML = rows.map(r => {
    const hl = r.Status === 'interested' ? 'highlight-interested' : r.Status === 'claimed' ? 'highlight-claimed' : '';
    const phone = r.Phone ? '<a href="tel:' + r.Phone.replace(/\D/g,'') + '">' + r.Phone + '</a>' : '<span style="color:#334155">—</span>';
    const email = r.Email && !r.Email.startsWith('%') ? '<a href="mailto:' + r.Email + '" title="' + r.Email + '">' + r.Email.slice(0,22) + (r.Email.length>22?'…':'') + '</a>' : '<span style="color:#334155">—</span>';
    let site = '—';
    if (r.Website && !r.Website.startsWith('www.powerupsolar') && r.Website.length > 3) {
      let url = r.Website;
      if (!url.startsWith('http')) url = 'https://' + url;
      const disp = url.replace(/https?:\/\/(www\.)?/,'').split('/')[0];
      site = '<a href="' + url + '" target="_blank" rel="noopener">' + disp.slice(0,20) + (disp.length>20?'…':'') + '</a>';
    }
    const rowKey = JSON.stringify(r['#']) + ',' + JSON.stringify(r.Company.slice(0,10));
    return '<tr class="' + hl + '" data-idx="' + r._idx + '">' +
      '<td class="num">' + r['#'] + '</td>' +
      '<td class="company" title="' + r.Company + '">' + r.Company.slice(0,28) + (r.Company.length>28?'…':'') + '</td>' +
      '<td class="contact" title="' + r.Contact + '">' + (r.Contact !== r.Company ? r.Contact.slice(0,18) + (r.Contact.length>18?'…':'') : '<span style="color:#334155">—</span>') + '</td>' +
      '<td class="city">' + r.City + '</td>' +
      '<td class="phone">' + phone + '</td>' +
      '<td class="email">' + email + '</td>' +
      '<td class="website">' + site + '</td>' +
      '<td><select class="status-select s-' + r.Status + '" onchange="changeStatus(this,' + r._idx + ')">' +
        '<option value="not_called"' + (r.Status==='not_called'?' selected':'') + '>⬜ Not Called</option>' +
        '<option value="interested"' + (r.Status==='interested'?' selected':'') + '>🔥 Interested</option>' +
        '<option value="voicemail"' + (r.Status==='voicemail'?' selected':'') + '>📬 Voicemail</option>' +
        '<option value="no_answer"' + (r.Status==='no_answer'?' selected':'') + '>❌ No Answer</option>' +
        '<option value="claimed"' + (r.Status==='claimed'?' selected':'') + '>✅ Claimed</option>' +
        '<option value="not_interested"' + (r.Status==='not_interested'?' selected':'') + '>🚫 Not Interested</option>' +
      '</select></td>' +
      '<td><input class="notes-input" type="text" value="' + (r.Notes||'').replace(/"/g,'&quot;') + '" placeholder="Notes..." onchange="changeNotes(this,' + r._idx + ')"></td>' +
    '</tr>';
  }).join('');
  document.getElementById('rowCount').textContent = rows.length + ' of ' + data.length + ' installers';
}

function changeStatus(el, idx) {
  data[idx].Status = el.value;
  el.className = 'status-select s-' + el.value;
  const tr = el.closest('tr');
  tr.className = el.value === 'interested' ? 'highlight-interested' : el.value === 'claimed' ? 'highlight-claimed' : '';
  saveRow(data[idx]['#'], data[idx].Company, data[idx].Status, data[idx].Notes);
  updateStats();
}

function changeNotes(el, idx) {
  data[idx].Notes = el.value;
  saveRow(data[idx]['#'], data[idx].Company, data[idx].Status, data[idx].Notes);
}

function sortBy(col) {
  if (sortCol === col) sortDir *= -1; else { sortCol = col; sortDir = 1; }
  document.querySelectorAll('thead th').forEach(th => { th.classList.remove('sorted-asc','sorted-desc'); if(th.dataset.col===col) th.classList.add(sortDir===1?'sorted-asc':'sorted-desc'); });
  render();
}

function populateCities() {
  const cities = [...new Set(data.map(r => r.City))].sort();
  const sel = document.getElementById('cityFilter');
  cities.forEach(c => { const o = document.createElement('option'); o.value = c; o.textContent = c; sel.appendChild(o); });
}

function exportCSV() {
  const rows = getFiltered();
  const cols = ['#','Company','Contact','City','Phone','Email','Website','Status','Notes'];
  const csv = [cols.join(','), ...rows.map(r => cols.map(c => '"' + String(r[c]||'').replace(/"/g,'""') + '"').join(','))].join('\n');
  const a = document.createElement('a'); a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
  a.download = 'solar-outreach-filtered.csv'; a.click();
}

loadState();
populateCities();
updateStats();
render();
</script>
