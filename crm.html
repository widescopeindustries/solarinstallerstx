<html lang="en">
<head>
<meta charset="UTF-8">

<title>☀️ SolarInstallersTX CRM v3.0</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0f;--bg2:#13131a;--bg3:#1a1a24;--bg4:#1e1e2e;--border:#2d2d3d;--text:#e2e8f0;--muted:#64748b;--gold:#fbbf24;--green:#34d399;--red:#f87171;--purple:#a78bfa;--blue:#60a5fa;--orange:#fb923c;--teal:#2dd4bf;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* NAV */
.nav{display:flex;align-items:center;background:var(--bg2);border-bottom:1px solid var(--border);padding:0 16px;height:52px;flex-shrink:0;gap:4px}
.nav-logo{font-size:15px;font-weight:800;background:linear-gradient(135deg,#f59e0b,#fbbf24);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-right:16px;white-space:nowrap}
.nav-tab{padding:6px 14px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;color:var(--muted);border:none;background:transparent;transition:all .15s;white-space:nowrap}
.nav-tab:hover{color:var(--text);background:var(--bg3)}
.nav-tab.active{color:var(--gold);background:rgba(251,191,36,.1)}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.user-badge{font-size:12px;color:var(--muted);background:var(--bg3);border:1px solid var(--border);border-radius:99px;padding:4px 12px}
.notif-btn{background:var(--bg3);border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer;transition:all .15s}
.notif-btn:hover{color:var(--gold);border-color:var(--gold)}

/* STATS BAR */
.stats-bar{display:flex;background:var(--bg2);border-bottom:1px solid var(--border);overflow-x:auto;flex-shrink:0}
.stat{padding:10px 16px;cursor:pointer;border-right:1px solid var(--border);transition:background .15s;white-space:nowrap;min-width:80px}
.stat:hover{background:var(--bg3)}
.stat.active-filter{background:rgba(251,191,36,.07);border-bottom:2px solid var(--gold)}
.stat .n{font-size:20px;font-weight:800;line-height:1.1}
.stat .l{font-size:9px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:.05em}
.n-total{color:var(--text)}.n-not{color:#475569}.n-vm{color:var(--purple)}.n-na{color:var(--red)}.n-msg{color:var(--teal)}.n-verified{color:var(--gold)}.n-bad{color:var(--red)}.n-closed{color:#334155}.n-nosolar{color:var(--orange)}.n-hung{color:var(--red)}.n-ni{color:#334155}.n-cb{color:var(--blue)}.n-int{color:var(--green)}.n-cl{color:var(--gold)}

/* MAIN */
.main{display:flex;flex-direction:column;flex:1;overflow:hidden}
.main-row{display:flex;flex:1;overflow:hidden}
.left{display:flex;flex-direction:column;flex:1;overflow:hidden;min-width:0}

/* TOOLBAR */
.toolbar{display:flex;gap:8px;padding:10px 14px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap;align-items:center}
.toolbar input,.toolbar select{background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:7px 11px;font-size:13px;outline:none}
.toolbar input{width:200px}.toolbar input:focus,.toolbar select:focus{border-color:var(--gold)}
.btn{background:var(--bg3);border:1px solid var(--border);color:var(--muted);font-size:12px;padding:7px 13px;border-radius:8px;cursor:pointer;transition:all .2s;white-space:nowrap}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn.primary{background:var(--gold);color:#000;font-weight:700;border-color:var(--gold)}
.btn.primary:hover{background:#f59e0b}
.btn.log-btn{background:rgba(96,165,250,.15);color:var(--blue);border-color:rgba(96,165,250,.3)}
.btn.log-btn:hover{background:rgba(96,165,250,.25);color:var(--blue)}
.row-count{font-size:12px;color:var(--muted);margin-left:auto}

/* TABLE */
.table-wrap{overflow:auto;flex:1}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{background:var(--bg2);color:var(--muted);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:9px 12px;text-align:left;border-bottom:2px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none;position:sticky;top:0;z-index:10}
thead th:hover{color:var(--gold)}
.sort-asc::after{content:' ↑';color:var(--gold)}.sort-desc::after{content:' ↓';color:var(--gold)}
tbody tr{border-bottom:1px solid #0e0e18;cursor:pointer;transition:background .1s}
tbody tr:hover{background:var(--bg3)}
tbody tr.selected{background:rgba(251,191,36,.07)!important}
tbody tr.hl-verified{background:#1a1400}
tbody tr.hl-msg{background:#031a18}
tbody tr.hl-int{background:#031a0e}
tbody tr.hl-cb{background:#0a1628}
tbody tr.hl-cl{background:#1a1000}
td{padding:9px 12px;vertical-align:middle;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.num{color:#334155;font-size:11px;width:38px;max-width:38px}
td.co{font-weight:600;color:var(--text)}
td.city{color:var(--muted);font-size:12px}
td.phone a{color:var(--blue);text-decoration:none;font-family:monospace;font-size:12px}
td.phone a:hover{text-decoration:underline}
.status-pill{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.p-not_called{background:#1a1a24;color:#475569}
.p-voicemail{background:#1a0a2e;color:var(--purple)}
.p-no_answer{background:#2d0808;color:var(--red)}
.p-bad_number{background:#2d0808;color:var(--red)}
.p-hung_up{background:#2d0808;color:var(--red)}
.p-no_longer_in_business{background:#111;color:#334155}
.p-closed_bankrupt{background:#111;color:#334155}
.p-does_not_do_solar{background:#2d1500;color:var(--orange)}
.p-messaged_with_person{background:#031a18;color:var(--teal)}
.p-got_verified{background:#2d1a00;color:var(--gold)}
.p-not_interested{background:#111;color:#334155}
.p-interested{background:#052e1a;color:var(--green)}
.p-callback{background:#0a1628;color:var(--blue)}
.p-claimed{background:#2d1a00;color:var(--gold)}
td.followup{font-size:11px;color:var(--blue)}
td.followup.overdue{color:var(--red);font-weight:600}
td.followup.today{color:var(--gold);font-weight:600}

/* DRAWER — right side panel */
.drawer{width:420px;flex-shrink:0;background:var(--bg2);border-left:2px solid var(--border);display:flex;flex-direction:column;overflow:hidden;transition:width .2s ease,opacity .2s ease}
.drawer.hidden{width:0;border:none;opacity:0;overflow:hidden}
.drawer:not(.hidden){opacity:1}
.drawer-header{padding:8px 12px;border-bottom:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;gap:8px}
.drawer-hinfo{flex:1;min-width:0;overflow:hidden}
.drawer-header h2{font-size:14px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drawer-header .sub{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.close-drawer{background:transparent;border:none;color:var(--muted);font-size:20px;cursor:pointer;line-height:1;padding:0 4px;flex-shrink:0}
.close-drawer:hover{color:var(--text)}
.drawer-body{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.field{margin-bottom:8px}
.field:last-child{margin-bottom:0}
.field label{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px}
.field-val{font-size:13px;color:var(--text);line-height:1.5}
.field-val a{color:var(--blue);text-decoration:none}
.field-val a:hover{text-decoration:underline}
.drawer select,.drawer textarea,.drawer input[type=text],.drawer input[type=email],.drawer input[type=datetime-local]{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:6px 10px;font-size:13px;outline:none;font-family:inherit}
.drawer select:focus,.drawer textarea:focus,.drawer input:focus{border-color:var(--gold)}
.save-indicator{font-size:11px;color:var(--green);opacity:0;transition:opacity .3s}
.save-indicator.show{opacity:1}
.drawer-footer{padding:8px 16px;border-top:1px solid var(--border);display:flex;gap:8px;flex-shrink:0;align-items:center}

/* LEFT PANEL — notes + log */
.notes-panel{display:flex;flex-direction:column;height:100%;gap:8px;min-height:0}
.notes-panel textarea{height:90px;resize:none;line-height:1.5;flex-shrink:0}
.log-history{flex:1;overflow-y:auto;min-height:0}
.log-history-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
.log-entry{background:var(--bg3);border-radius:8px;padding:8px 12px;margin-bottom:6px;border-left:3px solid var(--border);font-size:12px}
.log-entry.log-got_verified,.log-entry.log-claimed{border-color:var(--gold)}
.log-entry.log-messaged_with_person,.log-entry.log-interested{border-color:var(--teal)}
.log-entry.log-voicemail{border-color:var(--purple)}
.log-entry.log-callback{border-color:var(--blue)}
.log-entry.log-no_answer,.log-entry.log-bad_number,.log-entry.log-hung_up{border-color:var(--red)}
.log-entry.log-does_not_do_solar{border-color:var(--orange)}
.log-time{font-size:10px;color:var(--muted);margin-bottom:4px}
.log-meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.log-meta span{background:var(--bg4);border-radius:4px;padding:2px 7px;font-size:10px;color:var(--muted)}
.log-meta span.highlight{color:var(--text)}
.log-notes-text{color:var(--text);line-height:1.5}
.log-empty{color:var(--muted);font-size:12px;padding:12px 0;text-align:center}

/* RIGHT PANEL — fields */
.fields-col{display:flex;flex-direction:column;gap:0;overflow-y:auto;height:100%}
.section-divider{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--border);padding:6px 0 4px;border-top:1px solid var(--border);margin-top:4px}
.section-divider:first-child{border-top:none;margin-top:0;padding-top:0}

/* CONTACTED TOGGLE */
.contacted-row{display:flex;gap:6px;margin-bottom:8px}
.contacted-btn{flex:1;padding:5px 8px;border-radius:8px;border:1px solid var(--border);background:var(--bg3);color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;text-align:center}
.contacted-btn.yes.active{background:rgba(45,212,191,.15);border-color:var(--teal);color:var(--teal)}
.contacted-btn.no.active{background:rgba(248,113,113,.1);border-color:var(--red);color:var(--red)}
.contacted-btn:hover{border-color:var(--gold)}

/* CALENDAR VIEW */
.cal-wrap{flex:1;overflow-y:auto;padding:20px}
.cal-day{margin-bottom:20px}
.cal-day-header{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 0;border-bottom:1px solid var(--border);margin-bottom:8px}
.cal-day-header.today-header{color:var(--gold)}
.cal-item{background:var(--bg3);border-radius:8px;padding:10px 14px;margin-bottom:6px;cursor:pointer;display:flex;align-items:center;gap:12px;border-left:3px solid var(--border);transition:background .15s}
.cal-item:hover{background:var(--bg4)}
.cal-item.ci-got_verified,.cal-item.ci-interested,.cal-item.ci-messaged_with_person{border-color:var(--teal)}
.cal-item.ci-callback{border-color:var(--blue)}
.cal-item .ci-name{font-weight:600;font-size:13px}
.cal-item .ci-city{font-size:12px;color:var(--muted)}
.cal-item .ci-time{font-size:11px;color:var(--gold);margin-left:auto;white-space:nowrap}
.cal-empty{color:var(--muted);font-size:13px;padding:40px;text-align:center}

/* FOLLOW-UP BANNER */
.followup-banner{background:rgba(96,165,250,.08);border-bottom:1px solid rgba(96,165,250,.2);padding:8px 16px;font-size:12px;color:var(--blue);flex-shrink:0;display:none;align-items:center;gap:8px;flex-wrap:wrap}
.followup-banner.visible{display:flex}
.fu-chip{background:rgba(96,165,250,.15);border-radius:99px;padding:3px 10px;cursor:pointer;white-space:nowrap}
.fu-chip:hover{background:rgba(96,165,250,.25)}

/* TABS CONTENT */
.tab-content{display:none;flex:1;overflow:hidden;flex-direction:column}
.tab-content.active{display:flex}

/* LOADING */
.loading{display:flex;align-items:center;justify-content:center;flex:1;color:var(--muted);font-size:14px;gap:12px}
.spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.no-results{text-align:center;padding:60px;color:#334155;font-size:15px}
</style>
</head>

  const cols = 'id,name,company_name,location_city,phone,email,company_website,outreach_status,outreach_notes,follow_up_date,last_called_at,email_captured,updated_at';
  let all = [];
  
  for (let page = 0; page < 10; page++) {
    const from = page * 1000;
    const to = from + 999;
    document.getElementById('statsBar').innerHTML = `<div class="loading" style="padding:12px 20px"><div class="spinner"></div> Loading installers (${all.length})...</div>`;
    const { data, error } = await sb.from('installers').select(cols).order('id').range(from, to);
    if (error) {
      const isPaused = error.message && (error.message.includes('Project') || error.message.includes('paused') || error.code === '57P01');
      document.getElementById('statsBar').innerHTML = `<div style="padding:12px 20px;color:var(--red);font-size:13px">
        ⚠️ ${isPaused ? 'Supabase project is PAUSED — restore it at <a href="https://supabase.com/dashboard" target="_blank" style="color:var(--blue)">supabase.com/dashboard</a>' : 'DB error: ' + error.message}
      </div>`;
      document.getElementById('tbody').innerHTML = `<tr><td colspan="8" class="no-results" style="color:var(--red)">🔴 ${isPaused ? 'Database paused' : error.message}</td></tr>`;
      return;
    }
    if (data) all = all.concat(data);
    if (!data || data.length < 1000) break; // Last page
  }

  allData = all.map((r,i) => ({ ...r, _row: i+1, outreach_status: r.outreach_status || 'not_called' }));
  populateCities();
  renderStats();
  renderTable();
  renderCalendar();
  checkFollowUpBanner();
}

function populateCities() {
  const cities = [...new Set(allData.map(r => r.location_city).filter(Boolean))].sort();
  const sel = document.getElementById('cityFilter');
  sel.innerHTML = '<option value="">All Cities</option>';
  cities.forEach(c => { const o = document.createElement('option'); o.value = c; o.textContent = c; sel.appendChild(o); });
}

// ── STATS ──────────────────────────────────────────────
function renderStats() {
  const c = {};
  Object.keys(STATUS_LABELS).forEach(k => c[k] = 0);
  c.total = allData.length;
  allData.forEach(r => { if (c[r.outreach_status] !== undefined) c[r.outreach_status]++; });
  const sf = document.getElementById('statusFilter');
  const cur = sf.value;
  const items = [
    ['','All',c.total,'n-total',''],
    ['not_called','Not Called',c.not_called,'n-not','not_called'],
    ['voicemail','Voicemail',c.voicemail,'n-vm','voicemail'],
    ['no_answer','No Answer',c.no_answer,'n-na','no_answer'],
    ['bad_number','Bad #',c.bad_number,'n-bad','bad_number'],
    ['messaged_with_person','Messaged',c.messaged_with_person,'n-msg','messaged_with_person'],
    ['hung_up','Hung Up',c.hung_up,'n-hung','hung_up'],
    ['got_verified','Verified',c.got_verified,'n-verified','got_verified'],
    ['does_not_do_solar','Not Solar',c.does_not_do_solar,'n-nosolar','does_not_do_solar'],
    ['no_longer_in_business','Closed',c.no_longer_in_business,'n-closed','no_longer_in_business'],
    ['closed_bankrupt','Bankrupt',(c.closed_bankrupt||0),'n-closed','closed_bankrupt'],
    ['not_interested','Not Int.',(c.not_interested||0)+(c.interested||0)+(c.callback||0)+(c.claimed||0),'n-ni','not_interested'],
  ];
  document.getElementById('statsBar').innerHTML = items.map(([k,l,n,nc,fv]) =>
    `<div class="stat ${cur===fv?'active-filter':''}" onclick="filterStat('${fv}')"><span class="n ${nc}">${n}</span><span class="l">${l}</span></div>`
  ).join('');
}

function filterStat(val) {
  document.getElementById('statusFilter').value = val;
  renderTable();
  renderStats();
}

// ── TABLE ──────────────────────────────────────────────
function getFiltered() {
  const q = document.getElementById('search').value.toLowerCase();
  const city = document.getElementById('cityFilter').value;
  const status = document.getElementById('statusFilter').value;
  return allData.filter(r => {
    if (q && ![r.company_name,r.name,r.location_city,r.phone,r.email_captured].join(' ').toLowerCase().includes(q)) return false;
    if (city && r.location_city !== city) return false;
    if (status && r.outreach_status !== status) return false;
    return true;
  }).sort((a,b) => {
    let av = a[sortCol], bv = b[sortCol];
    if (sortCol === 'id' || sortCol === '#') { av = +a._row; bv = +b._row; }
    else { av = String(av||'').toLowerCase(); bv = String(bv||'').toLowerCase(); }
    return av < bv ? -sortDir : av > bv ? sortDir : 0;
  });
}

function renderTable() {
  const rows = getFiltered();
  const now = new Date();
  const today = now.toDateString();
  const tbody = document.getElementById('tbody');
  if (!rows.length) { tbody.innerHTML = '<tr><td colspan="8" class="no-results">No results</td></tr>'; }
  else {
    tbody.innerHTML = rows.map(r => {
      const hl = ROW_HL[r.outreach_status] || '';
      const sel = r.id === selectedId ? 'selected' : '';
      const phone = r.phone ? `<a href="tel:${r.phone.replace(/\D/g,'')}">${r.phone}</a>` : '<span style="color:#334155">—</span>';
      const pill = `<span class="status-pill p-${r.outreach_status}">${STATUS_LABELS[r.outreach_status]||r.outreach_status}</span>`;
      let fu = '—', fuCls = '';
      if (r.follow_up_date) {
        const d = new Date(r.follow_up_date);
        if (d.toDateString() === today) { fu = '⚡ Today ' + d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); fuCls = 'today'; }
        else if (d < now) { fu = '⚠️ ' + d.toLocaleDateString(); fuCls = 'overdue'; }
        else { fu = d.toLocaleDateString() + ' ' + d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); }
      }
      const lc = r.last_called_at ? timeAgo(new Date(r.last_called_at)) : '—';
      const ec = r.email_captured ? `<span style="color:var(--teal);font-size:11px">✓ ${r.email_captured.slice(0,20)}</span>` : '<span style="color:#334155">—</span>';
      const webIcon = r.company_website ? ` <a href="${r.company_website.startsWith('http')?r.company_website:'https://'+r.company_website}" target="_blank" onclick="event.stopPropagation()" title="${r.company_website}" style="color:var(--blue);text-decoration:none;font-size:11px">🌐</a>` : '';
      const cname = (r.company_name||r.name||'');
      return `<tr class="${hl} ${sel}" onclick="openDrawer('${r.id}')">
        <td class="num">${r._row}</td>
        <td class="co" title="${cname}">${cname.slice(0,26)}${cname.length>26?'…':''}${webIcon}</td>
        <td class="city">${r.location_city||'—'}</td>
        <td class="phone">${phone}</td>
        <td>${ec}</td>
        <td>${pill}</td>
        <td class="followup ${fuCls}">${fu}</td>
        <td style="font-size:11px;color:var(--muted)">${lc}</td>
      </tr>`;
    }).join('');
  }
  const cnt = `${rows.length} of ${allData.length} installers`;
  document.getElementById('rowCount').textContent = cnt;
  document.getElementById('rowCountBottom').textContent = cnt;
  document.querySelectorAll('thead th').forEach(th => { th.classList.remove('sort-asc','sort-desc'); if(th.dataset.col===sortCol) th.classList.add(sortDir===1?'sort-asc':'sort-desc'); });
}

function sortBy(col) {
  if (sortCol===col) sortDir*=-1; else { sortCol=col; sortDir=1; }
  renderTable();
}

// ── DRAWER ─────────────────────────────────────────────
function openDrawer(id) {
  selectedId = id;
  const r = allData.find(x => x.id === id);
  if (!r) return;
  document.querySelectorAll('tbody tr').forEach(tr => tr.classList.remove('selected'));
  const el = document.querySelector(`tbody tr[onclick="openDrawer('${id}')"]`);
  if (el) el.classList.add('selected');
  document.getElementById('drawerName').textContent = r.company_name || r.name || '—';
  document.getElementById('drawerSub').textContent = [r.location_city, r.phone].filter(Boolean).join(' · ');
  const wBtn = document.getElementById('drawerWebsiteBtn');
  if (r.company_website) {
    wBtn.href = r.company_website.startsWith('http') ? r.company_website : 'https://' + r.company_website;
    wBtn.style.display = '';
  } else {
    wBtn.style.display = 'none';
  }
  document.getElementById('drawer').classList.remove('hidden');
  const fuVal = r.follow_up_date ? new Date(r.follow_up_date).toISOString().slice(0,16) : '';

  // Determine contacted state from status
  const contacted = r.outreach_status !== 'not_called' ? 'yes' : '';

  document.getElementById('drawerBody').innerHTML = `
    <div class="section-divider">Contact Status</div>
    <div class="field">
      <label>Contacted?</label>
      <div class="contacted-row">
        <button class="contacted-btn yes ${contacted==='yes'?'active':''}" onclick="setContacted('yes',this)">✓ Yes</button>
        <button class="contacted-btn no ${contacted===''?'active':''}" onclick="setContacted('no',this)">✗ No</button>
      </div>
    </div>
    <div class="field">
      <label>Status</label>
      <select id="dStatus">
        ${Object.entries(STATUS_LABELS).map(([v,l]) => `<option value="${v}"${r.outreach_status===v?' selected':''}>${l}</option>`).join('')}
      </select>
    </div>
    <div class="field">
      <label>Outreach Method</label>
      <select id="dMethod">
        ${OUTREACH_METHODS.map(m=>`<option value="${m.v}">${m.l}</option>`).join('')}
      </select>
    </div>
    <div class="field">
      <label>File Under</label>
      <select id="dFileUnder">
        ${FILE_UNDER.map(f=>`<option value="${f.v}">${f.l}</option>`).join('')}
      </select>
    </div>

    <div class="section-divider">Contact Info</div>
    <div class="field">
      <label>Point of Contact</label>
      <input type="text" id="dPOC" value="${r.name&&r.name!==r.company_name?r.name:''}" placeholder="Who answered / best contact">
    </div>
    <div class="field">
      <label>Email</label>
      <input type="text" id="dEmail" value="${r.email_captured||''}" placeholder="email@company.com">
    </div>
    <div class="field">
      <label>Follow-up</label>
      <input type="datetime-local" id="dFollowup" value="${fuVal}">
    </div>

    <div class="section-divider">📝 Notes</div>
    <textarea id="dNotes" style="height:120px;resize:vertical" placeholder="Notes...">${r.outreach_notes||''}</textarea>

    <div class="section-divider">📞 Call History</div>
    <div id="callLog" style="flex:1;overflow-y:auto;min-height:100px"><div class="log-empty">Loading...</div></div>
  `;

  loadCallLog(r.company_name || r.name);
}

function setContacted(val, btn) {
  document.querySelectorAll('.contacted-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  btn.dataset.val = val;
  // If clicking "No", reset status to not_called
  if (val === 'no') {
    document.getElementById('dStatus').value = 'not_called';
  } else {
    // If yes and status is not_called, switch to voicemail as default
    if (document.getElementById('dStatus').value === 'not_called') {
      document.getElementById('dStatus').value = 'voicemail';
    }
  }
}

async function loadCallLog(companyName) {
  const el = document.getElementById('callLog');
  if (!el) return;
  // Query by installer_name since installer_id column is bigint (incompatible with UUID)
  const { data, error } = await sb.from('outreach_log')
    .select('*')
    .eq('installer_name', companyName)
    .order('called_at', { ascending: false })
    .limit(25);
  if (error || !data || !data.length) {
    el.innerHTML = '<div class="log-empty">No calls logged yet — click "Log This Call" after each contact attempt.</div>';
    return;
  }
  el.innerHTML = data.map(l => {
    let meta = {};
    try { meta = JSON.parse(l.notes || '{}'); } catch(e) { meta = { text: l.notes }; }
    const statusLabel = STATUS_LABELS[l.status] || l.status;
    const fuLabel = meta.file_under ? FILE_UNDER.find(f=>f.v===meta.file_under)?.l || meta.file_under : null;
    const methodLabel = meta.outreach_method ? OUTREACH_METHODS.find(m=>m.v===meta.outreach_method)?.l || meta.outreach_method : null;
    return `<div class="log-entry log-${l.status}">
      <div class="log-time">${new Date(l.called_at).toLocaleString()} · ${l.called_by||'Elise'}</div>
      <div class="log-meta">
        <span class="highlight">${statusLabel}</span>
        ${fuLabel ? `<span>${fuLabel}</span>` : ''}
        ${methodLabel ? `<span>${methodLabel}</span>` : ''}
        ${meta.poc ? `<span>👤 ${meta.poc}</span>` : ''}
        ${l.follow_up_date ? `<span>📅 F/U: ${new Date(l.follow_up_date).toLocaleDateString()}</span>` : ''}
      </div>
      ${meta.text ? `<div class="log-notes-text">${meta.text}</div>` : ''}
    </div>`;
  }).join('');
}

function closeDrawer() {
  document.getElementById('drawer').classList.add('hidden');
  selectedId = null;
  document.querySelectorAll('tbody tr').forEach(t => t.classList.remove('selected'));
}

async function saveRecord() {
  if (!selectedId) return;
  const r = allData.find(x => x.id === selectedId);
  const status = document.getElementById('dStatus')?.value || r.outreach_status;
  const notes = document.getElementById('dNotes')?.value || '';
  const email_captured = document.getElementById('dEmail')?.value || '';
  const follow_up_date = document.getElementById('dFollowup')?.value || null;
  const poc = document.getElementById('dPOC')?.value || '';
  const wasNew = r.outreach_status === 'not_called' && status !== 'not_called';
  const update = {
    outreach_status: status,
    outreach_notes: notes,
    email_captured,
    follow_up_date,
    name: poc || r.name, // store POC in name field
    updated_at: new Date().toISOString()
  };
  if (wasNew || (status !== 'not_called' && !r.last_called_at)) update.last_called_at = new Date().toISOString();
  const { error } = await sb.from('installers').update(update).eq('id', selectedId);
  if (!error) {
    Object.assign(r, update);
    renderTable(); renderStats(); renderCalendar(); checkFollowUpBanner();
    const ind = document.getElementById('saveInd');
    ind.classList.add('show');
    setTimeout(() => ind.classList.remove('show'), 2000);
    if (follow_up_date) scheduleNotification(r.company_name || r.name, new Date(follow_up_date));
  }
}

async function logCall() {
  if (!selectedId) return;
  const r = allData.find(x => x.id === selectedId);
  const status = document.getElementById('dStatus')?.value || r.outreach_status;
  const notes = document.getElementById('dNotes')?.value || '';
  const follow_up_date = document.getElementById('dFollowup')?.value || null;
  const poc = document.getElementById('dPOC')?.value || '';
  const method = document.getElementById('dMethod')?.value || '';
  const fileUnder = document.getElementById('dFileUnder')?.value || '';
  const companyName = r.company_name || r.name;

  // Build structured notes JSON for the log
  const logNotes = JSON.stringify({
    text: notes,
    outreach_method: method,
    file_under: fileUnder,
    poc: poc,
    contacted: status !== 'not_called' ? 'yes' : 'no'
  });

  // Insert into outreach_log — using installer_name (NOT installer_id, which is bigint-incompatible)
  const { error: logErr } = await sb.from('outreach_log').insert({
    installer_name: companyName,
    city: r.location_city,
    status,
    notes: logNotes,
    called_by: CALLER,
    follow_up_date: follow_up_date || null,
    called_at: new Date().toISOString()
  });

  if (logErr) {
    console.error('Log error:', logErr);
    alert('⚠️ Error saving call log: ' + logErr.message);
    return;
  }

  // Save the installer record
  await saveRecord();

  // Refresh the call log in drawer
  loadCallLog(companyName);

  // Refresh global log tab if active
  renderLog();

  // Reset method and file_under dropdowns after logging
  const mEl = document.getElementById('dMethod');
  const fEl = document.getElementById('dFileUnder');
  if (mEl) mEl.value = '';
  if (fEl) fEl.value = '';

  // Flash success on the log button
  const logBtn = document.querySelector('.log-btn');
  const origText = logBtn.textContent;
  logBtn.textContent = '✅ Call Logged!';
  logBtn.style.background = 'rgba(52,211,153,.2)';
  logBtn.style.color = 'var(--green)';
  logBtn.style.borderColor = 'var(--green)';
  setTimeout(() => { logBtn.textContent = origText; logBtn.style.background = ''; logBtn.style.color = ''; logBtn.style.borderColor = ''; }, 2000);
}

// ── CALENDAR ───────────────────────────────────────────
function renderCalendar() {
  const items = allData.filter(r => r.follow_up_date).sort((a,b) => new Date(a.follow_up_date)-new Date(b.follow_up_date));
  if (!items.length) { document.getElementById('calWrap').innerHTML = '<div class="cal-empty">No follow-ups scheduled yet.</div>'; return; }
  const groups = {};
  items.forEach(r => {
    const d = new Date(r.follow_up_date).toDateString();
    if (!groups[d]) groups[d] = [];
    groups[d].push(r);
  });
  const today = new Date().toDateString();
  document.getElementById('calWrap').innerHTML = Object.entries(groups).map(([dateStr, rows]) => {
    const isToday = dateStr === today;
    const isPast = new Date(dateStr) < new Date() && !isToday;
    return `<div class="cal-day">
      <div class="cal-day-header ${isToday?'today-header':''}">${isToday?'⚡ TODAY — ':isPast?'⚠️ OVERDUE — ':''}${new Date(dateStr).toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'})}</div>
      ${rows.map(r => `<div class="cal-item ci-${r.outreach_status}" onclick="switchTab('installers',document.querySelector('.nav-tab'));openDrawer('${r.id}')">
        <div><div class="ci-name">${r.company_name||r.name}</div><div class="ci-city">${r.location_city||''}</div></div>
        <div class="ci-time">${new Date(r.follow_up_date).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div>
        <span class="status-pill p-${r.outreach_status}" style="font-size:10px">${STATUS_LABELS[r.outreach_status]||r.outreach_status}</span>
      </div>`).join('')}
    </div>`;
  }).join('');
}

// ── LOG TAB ────────────────────────────────────────────
async function renderLog() {
  const { data } = await sb.from('outreach_log').select('*').order('called_at', {ascending:false}).limit(100);
  const body = document.getElementById('logBody');
  if (!data || !data.length) { body.innerHTML = '<tr><td colspan="8" class="no-results">No calls logged yet.</td></tr>'; return; }
  body.innerHTML = data.map(l => {
    let meta = {};
    try { meta = JSON.parse(l.notes || '{}'); } catch(e) { meta = { text: l.notes || '' }; }
    // Handle plain text notes (non-JSON)
    if (typeof meta === 'string') meta = { text: meta };
    const fuLabel = meta.file_under ? (FILE_UNDER.find(f=>f.v===meta.file_under)?.l||meta.file_under) : '—';
    const methodLabel = meta.outreach_method ? (OUTREACH_METHODS.find(m=>m.v===meta.outreach_method)?.l||meta.outreach_method) : '—';
    const noteText = (meta.text || '').replace(/</g,'&lt;').slice(0, 150);
    return `<tr>
      <td style="font-size:11px;color:var(--muted);white-space:nowrap">${new Date(l.called_at).toLocaleString()}</td>
      <td style="font-weight:600">${l.installer_name||'—'}</td>
      <td style="color:var(--muted);font-size:12px">${l.city||'—'}</td>
      <td><span class="status-pill p-${l.status}">${STATUS_LABELS[l.status]||l.status}</span></td>
      <td style="font-size:12px;color:var(--muted)">${fuLabel}</td>
      <td style="font-size:12px;color:var(--muted)">${methodLabel}</td>
      <td style="font-size:12px;color:var(--muted);max-width:200px;overflow:hidden;text-overflow:ellipsis" title="${noteText}">${noteText||'—'}</td>
      <td style="font-size:12px;color:var(--muted)">${meta.poc||l.called_by||'—'}</td>
    </tr>`;
  }).join('');
}

// ── FOLLOW-UP BANNER ───────────────────────────────────
function checkFollowUpBanner() {
  const now = new Date();
  const eod = new Date(); eod.setHours(23,59,59);
  const startOfDay = new Date(now); startOfDay.setHours(0,0,0,0);
  const due = allData.filter(r => r.follow_up_date && new Date(r.follow_up_date) <= eod && new Date(r.follow_up_date) >= startOfDay);
  const banner = document.getElementById('fuBanner');
  if (!due.length) { banner.classList.remove('visible'); return; }
  banner.classList.add('visible');
  document.getElementById('fuChips').innerHTML = due.slice(0,8).map(r =>
    `<span class="fu-chip" onclick="openDrawer('${r.id}')">${r.company_name||r.name} (${new Date(r.follow_up_date).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})})</span>`
  ).join('');
}

// ── NOTIFICATIONS ──────────────────────────────────────
function enableNotifications() {
  if (!('Notification' in window)) { alert('Notifications not supported in this browser.'); return; }
  Notification.requestPermission().then(p => {
    const btn = document.getElementById('notifBtn');
    if (p === 'granted') {
      btn.textContent = '🔔 Reminders ON';
      btn.style.color = 'var(--green)';
      btn.style.borderColor = 'var(--green)';
      localStorage.setItem('notif','on');
      // Schedule any existing follow-ups
      allData.filter(r => r.follow_up_date).forEach(r => scheduleNotification(r.company_name||r.name, new Date(r.follow_up_date)));
    } else {
      btn.textContent = '🔕 Blocked';
    }
  });
}
function scheduleNotification(name, date) {
  if (localStorage.getItem('notif') !== 'on') return;
  const ms = date - new Date();
  if (ms <= 0 || ms > 24*3600*1000) return;
  setTimeout(() => {
    if (Notification.permission === 'granted')
      new Notification('☀️ Follow-up Due!', { body: `Call ${name} now!` });
  }, ms);
}
// Check every minute
setInterval(() => {
  if (localStorage.getItem('notif') !== 'on') return;
  const now = new Date();
  allData.filter(r => r.follow_up_date).forEach(r => {
    const d = new Date(r.follow_up_date);
    if (Math.abs(d - now) < 60000 && Notification.permission === 'granted')
      new Notification('☀️ Follow-up Due!', { body: `Call ${r.company_name||r.name} (${r.location_city})` });
  });
}, 60000);

// ── TABS ───────────────────────────────────────────────
function switchTab(tab, btn) {
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-'+tab)?.classList.add('active');
  if (btn) btn.classList.add('active');
  if (tab === 'log') renderLog();
}

// ── UTILS ──────────────────────────────────────────────
function timeAgo(d) {
  const s = Math.floor((new Date()-d)/1000);
  if (s<60) return 'just now';
  if (s<3600) return Math.floor(s/60)+'m ago';
  if (s<86400) return Math.floor(s/3600)+'h ago';
  return Math.floor(s/86400)+'d ago';
}

function exportCSV() {
  const rows = getFiltered();
  const cols = ['_row','company_name','location_city','phone','email','email_captured','outreach_status','outreach_notes','follow_up_date','last_called_at'];
  const headers = ['#','Company','City','Phone','Email','Email Captured','Status','Notes','Follow-up','Last Contacted'];
  const csv = [headers.join(','), ...rows.map(r => cols.map(c => `"${String(r[c]||'').replace(/"/g,'""')}"`).join(','))].join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
  a.download = 'solar-crm-export.csv';
  a.click();
}

// ── INIT ───────────────────────────────────────────────
if (localStorage.getItem('notif') === 'on') {
  const btn = document.getElementById('notifBtn');
  btn.textContent = '🔔 Reminders ON';
  btn.style.color = 'var(--green)';
  btn.style.borderColor = 'var(--green)';
}

loadData();
setInterval(loadData, 90000);
</script>
</body>
